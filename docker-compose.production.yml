services:
  app:
    environment:
      PUBLIC_SHORT_URL_BASE: https://${APP_DOMAIN:-t4v.ir}
      COOKIE_SECURE: "true"

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-t4v.ir}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
