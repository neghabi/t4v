name: t4v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-t4v}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/docker-up.ps1 first}
      POSTGRES_DB: ${POSTGRES_DB:-t4v}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-t4v} -d ${POSTGRES_DB:-t4v}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run scripts/docker-up.ps1 first}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run scripts/docker-up.ps1 first}
      APP_SECRET: ${APP_SECRET:?Run scripts/docker-up.ps1 first}
      DASHBOARD_SECRET: ${DASHBOARD_SECRET:?Run scripts/docker-up.ps1 first}
      PUBLIC_SHORT_URL_BASE: ${PUBLIC_SHORT_URL_BASE:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
